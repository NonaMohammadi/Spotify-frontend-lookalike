<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify — Welcome Back</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    
    body {
      overflow: hidden;
      background: #0a0010;
    }

    .login-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .login-illustration {
      position: relative;
      background: radial-gradient(ellipse at 40% 50%, #3b0073 0%, #1a0040 40%, #0a0010 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .login-illustration::before {
      content: '';
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,0.35) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: glow-pulse 3s ease-in-out infinite;
    }

    .login-illustration::after {
      content: '';
      position: absolute;
      inset: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="20" cy="20" r="1" fill="%237c3aed" opacity="0.4"/><circle cx="80" cy="60" r="1.5" fill="%239f67ff" opacity="0.3"/><circle cx="60" cy="85" r="1" fill="%237c3aed" opacity="0.2"/><circle cx="40" cy="10" r="0.8" fill="%23ffffff" opacity="0.15"/></svg>') repeat;
      animation: starfield 20s linear infinite;
      pointer-events: none;
    }

    @keyframes starfield {
      from { background-position: 0 0; }
      to   { background-position: 100px 100px; }
    }

    .illustration-img {
      width: 420px;
      height: 520px;
      object-fit: contain;
      position: relative;
      z-index: 2;
      animation: twin-breathe 4s ease-in-out infinite;
      filter: drop-shadow(0 0 40px rgba(124,58,237,0.5));
    }

    /* Right — Form */
    .login-form-side {
      background: radial-gradient(ellipse at 60% 30%, #1a0042 0%, #0d0020 60%, #060010 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-12) var(--space-12);
      position: relative;
    }

    .login-logo {
      margin-bottom: var(--space-6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-3);
    }

    .login-logo .logo-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .login-logo img.spotify-logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: contain;
    }

    .login-heading {
      font-size: var(--fs-4xl);
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: var(--space-2);
      text-align: center;
      letter-spacing: -1px;
    }

    .login-subheading {
      font-size: var(--fs-lg);
      color: var(--text-secondary);
      margin-bottom: var(--space-8);
      text-align: center;
    }

    /* Form Fields */
    .login-form {
      width: 100%;
      max-width: 380px;
    }

    .form-field {
      margin-bottom: var(--space-4);
    }

    .form-input {
      width: 100%;
      padding: var(--space-4) var(--space-4);
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: var(--fs-base);
      transition: all var(--transition-fast);
    }

    .form-input:focus {
      border-color: var(--accent-purple);
      background: rgba(124,58,237,0.08);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    /* Login Button */
    .btn-login {
      width: 100%;
      padding: var(--space-4);
      background: var(--accent-purple);
      color: white;
      border-radius: var(--radius-md);
      font-size: var(--fs-md);
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-bottom: var(--space-6);
      transition: all var(--transition-normal);
      position: relative;
      overflow: hidden;
    }

    .btn-login::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .btn-login:hover {
      background: var(--accent-purple-dark);
      box-shadow: var(--shadow-purple);
      transform: translateY(-1px);
    }

    .btn-login:hover::after { opacity: 1; }
    .btn-login:active { transform: translateY(0); }

    /* Divider */
    .login-divider {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-5);
      color: var(--text-muted);
      font-size: var(--fs-sm);
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.12);
    }

    /* OAuth Buttons */
    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      width: 100%;
      padding: var(--space-3) var(--space-4);
      background: rgba(255,255,255,0.9);
      color: #1a1a1a;
      border-radius: var(--radius-md);
      font-size: var(--fs-base);
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-bottom: var(--space-3);
      transition: all var(--transition-fast);
    }

    .oauth-btn:hover {
      background: rgba(255,255,255,1);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .oauth-btn .oauth-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
    }

    .oauth-btn.apple-btn {
      background: rgba(255,255,255,0.9);
    }

    /* Footer links */
    .login-footer {
      text-align: center;
      margin-top: var(--space-6);
    }

    .link-underline {
      color: var(--text-secondary);
      font-size: var(--fs-base);
      text-decoration: underline;
      cursor: pointer;
      display: block;
      margin-bottom: var(--space-3);
      transition: color var(--transition-fast);
    }

    .link-underline:hover { color: var(--text-primary); }

    .signup-link {
      font-size: var(--fs-base);
      color: var(--text-secondary);
    }

    .signup-link a {
      color: var(--accent-purple-light);
      font-weight: 600;
    }

    .signup-link a:hover { color: var(--text-accent); text-decoration: underline; }

    /* Spring animation for heading words */
    .login-heading .spring-word { opacity: 0; }

    /* ── MOBILE LOGIN ─────────────────────────────────────── */
    @media (max-width: 768px) {
      body { overflow: auto; }

      .login-page {
        grid-template-columns: 1fr;
        min-height: 100vh;
      }

      .login-illustration {
        height: 260px;
        order: -1;
      }

      .illustration-img {
        width: 200px;
        height: 200px;
      }

      .login-form-side {
        padding: var(--space-8) var(--space-6);
      }

      .login-heading {
        font-size: var(--fs-3xl);
      }
    }

    @media (max-width: 480px) {
      .login-illustration { height: 220px; }
      .illustration-img { width: 160px; height: 160px; }
      .login-heading { font-size: var(--fs-2xl); }
      .login-form-side { padding: var(--space-6) var(--space-4); }
    }

  .illustration-img {
  width: 420px;
  height: 420px;
  object-fit: cover;
  border-radius: 50%;
  position: relative;
  z-index: 2;
  animation: twin-breathe 4s ease-in-out infinite;
  filter: drop-shadow(0 0 40px rgba(124,58,237,0.5));
}

.login-illustration {
  display: flex;
  align-items: center;
  justify-content: center;
}

  </style>
</head>
<body>

<div class="login-page" role="main">

  <!-- Left: Illustration -->
  <div class="login-illustration" aria-hidden="true">
   
    <img
      src="img/Screenshot 2026-06-19 235318.png"
      alt="Aurora AI character"
      class="illustration-img"
    />
  </div>

  <!-- Right: Login Form -->
  <div class="login-form-side">

    <div class="login-logo">
      <div class="logo-icon">
        <img src="img/Spotify_Primary_Logo_RGB_White.png" class="img.spotify-logo"/>
      </div>
    </div>

    <h1 class="login-heading" id="login-heading">
      <span class="spring-word">welcome</span>
      <span class="spring-word"> back!</span>
    </h1>
    <p class="login-subheading">Log in to continue</p>

    <form class="login-form" aria-labelledby="login-heading" onsubmit="handleLogin(event)">
      <div class="form-field">
        <label for="email" class="sr-only">Email or username</label>
        <input
          type="text"
          id="email"
          class="form-input"
          placeholder="Email or username"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-field">
        <label for="password" class="sr-only">Password</label>
        <input
          type="password"
          id="password"
          class="form-input"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn-login" id="login-btn">
        Log In
      </button>

      <div class="login-divider">or continue with</div>

      <button type="button" class="oauth-btn" onclick="handleOAuth('google')">
        <span class="oauth-icon">
          <!-- Google SVG icon -->
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
        </span>
        Google
      </button>

      <button type="button" class="oauth-btn apple-btn" onclick="handleOAuth('apple')">
        <span class="oauth-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#000">
            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.41c1.29.07 2.18.79 2.93.82.74.04 2.12-.99 3.6-.84a5.4 5.4 0 0 1 4.26 2.29c-3.84 2.36-3.21 7.53.75 9.08-.62 1.45-1.43 2.87-2.54 3.52zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </svg>
        </span>
        Apple
      </button>

      <div class="login-footer">
        <a href="#" class="link-underline">Log in without password</a>
        <p class="signup-link">
          Don't have an account?
          <a href="#">Sign up for Spotify</a>
        </p>
      </div>
    </form>

  </div>
</div>

<script>
  // Spring word animation on load
  document.addEventListener('DOMContentLoaded', () => {
    const words = document.querySelectorAll('#login-heading .spring-word');
    words.forEach((w, i) => {
      setTimeout(() => {
        w.style.animation = 'spring-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
      }, i * 100);
    });
  });

  function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.textContent = 'Logging in…';
    btn.disabled = true;
    // Simulate login → redirect to main page
    setTimeout(() => {
      window.location.href = 'main.html';
    }, 800);
  }

  function handleOAuth(provider) {
    // Simulate OAuth flow → redirect
    console.log('OAuth with', provider);
    setTimeout(() => {
      window.location.href = 'main.html';
    }, 500);
  }
</script>

</body>
</html>
